[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B904: we intentionally raise sanitized HTTPExceptions without chaining the
#   original traceback, so it is never exposed through the API response.
# B008: FastAPI's dependency-injection uses `Depends()` in argument defaults.
ignore = ["B904", "B008"]
